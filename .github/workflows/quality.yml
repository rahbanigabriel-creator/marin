name: Quality

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marpin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marpin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marpin_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/marpin_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marpin_ci
      MARPIN_INTEGRATION_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secret:scan
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma migrate deploy
      - run: npm run test:db
      - run: npm run quality
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
